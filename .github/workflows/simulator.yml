name: simulator

on:
  push:
    paths: ["simulator/**", ".github/workflows/simulator.yml"]
  pull_request:
    paths: ["simulator/**", ".github/workflows/simulator.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The private solutions repo is not available in CI: solution replays are skipped,
      # structure, parsers, scenario setup and grading are still tested.
      - run: uv run pytest
